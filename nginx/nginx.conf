worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    upstream auth_service {
        server auth:8000;
    }

    upstream documents_service {
        server documents:8000;
    }

    upstream agent_service {
        server agent:8000;
    }

    upstream billing_service {
        server billing:8000;
    }

    server {
        listen 80;
        server_name api.seu-dominio.com;

        set $allowed_origin "";

        if ($http_origin ~* "^https?://(localhost(:5173)?|127.0.0.1(:5173)?)$") {
            set $allowed_origin $http_origin;
        }

        add_header Access-Control-Allow-Origin $allowed_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        # Encaminhado por um load balancer que já termina TLS.
        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/documents/ {
            proxy_pass http://documents_service/documents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/agent/ {
            proxy_pass http://agent_service/agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/billing/ {
            proxy_pass http://billing_service/billing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
