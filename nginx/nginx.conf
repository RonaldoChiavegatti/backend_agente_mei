worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    log_format json_combined escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request"'
        ',"status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout json_combined;
    error_log /dev/stderr info;

    upstream auth_service {
        server auth:8000;
    }

    upstream documents_service {
        server documents:8000;
    }

    upstream agent_service {
        server agent:8000;
    }

    upstream billing_service {
        server billing:8000;
    }

    server {
        listen 80;
        # Aceita qualquer host (útil para desenvolvimento local e ambientes atrás de load balancer)
        server_name _;

        set $allowed_origin "";

        # Libera qualquer aplicação frontend rodando em localhost/127.0.0.1 com portas padrão do Vite (5173).
        if ($http_origin ~* "^https?://(localhost(:5173)?|127\.0\.0\.1(:5173)?)$") {
            set $allowed_origin $http_origin;
        }

        add_header Access-Control-Allow-Origin $allowed_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # Encaminhado por um load balancer que já termina TLS.
        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/auth/health {
            proxy_pass http://auth_service/auth/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/documents/ {
            proxy_pass http://documents_service/documents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/documents/health {
            proxy_pass http://documents_service/documents/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/agent/ {
            proxy_pass http://agent_service/agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/agent/health {
            proxy_pass http://agent_service/agent/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/billing/ {
            proxy_pass http://billing_service/billing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/billing/health {
            proxy_pass http://billing_service/billing/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
